<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pueui</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>pueui</h1>
      <nav>
        <button class="tab-btn active" data-tab="queue">Queue</button>
        <button class="tab-btn" data-tab="status">Status</button>
      </nav>
    </header>

    <main>
      <section id="tab-queue" class="tab active">
        <div class="dropzone-row">

          <div class="dropzone-panel">
            <div class="panel-label">Source</div>
            <div class="dropzone" id="source-drop">
              <div class="drop-hint">Drop file or folder here</div>
              <input type="text" id="source-path" placeholder="/path/to/source" autocomplete="off" spellcheck="false">
            </div>
            <label class="checkbox-label">
              <input type="checkbox" id="trailing-slash">
              <span>Trailing slash <small>(copy contents, not folder)</small></span>
            </label>
          </div>

          <div class="arrow">→</div>

          <div class="dropzone-panel">
            <div class="panel-label">Destination</div>
            <div class="dropzone" id="dest-drop">
              <div class="drop-hint">Drop folder here, type, or select saved</div>
              <input type="text" id="dest-path" placeholder="/path/to/dest or user@host:/path" autocomplete="off" spellcheck="false">
            </div>
            <div class="saved-destinations" id="saved-destinations"></div>
            <div class="save-dest-row">
              <input type="text" id="save-dest-name" placeholder="Label for current destination">
              <button id="save-dest-btn">Save</button>
            </div>
          </div>

        </div>

        <div class="queue-controls">
          <label class="bwlimit-label">
            <span>Bandwidth limit (KB/s)</span>
            <input type="number" id="bwlimit" value="20000" min="1" step="1000">
          </label>
          <button id="queue-btn" disabled>Queue</button>
        </div>

        <div id="queue-toast" class="toast hidden"></div>
      </section>

      <section id="tab-status" class="tab">
        <div class="status-header">
          <span id="status-count"></span>
        </div>
        <div class="table-wrap">
          <table id="status-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Command</th>
                <th>Started</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="status-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
